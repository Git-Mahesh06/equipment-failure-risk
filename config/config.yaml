seed: 20261022

generation:
  mode: full
  plants: 3
  lines: 12
  machines: 100
  sensors: 500
  telemetry_days: 90
  telemetry_interval_minutes: 30
  target_failures: 150

output:
  directory: data/generated
  ground_truth_directory: data/ground_truth
  exceptions_directory: data/exceptions

sensors:
  temperature:
    unit: degC
    min_value: 0
    max_value: 150
    normal_min: 40
    normal_max: 80
  vibration:
    unit: mm/s
    min_value: 0
    max_value: 50
    normal_min: 0
    normal_max: 8
  pressure:
    unit: kPa
    min_value: 0
    max_value: 1500
    normal_min: 200
    normal_max: 1000
  current:
    unit: A
    min_value: 0
    max_value: 500
    normal_min: 5
    normal_max: 150
