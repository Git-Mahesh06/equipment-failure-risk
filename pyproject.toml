
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-risk"
version = "0.1.0"
description = "Synthetic industrial equipment failure-risk dataset generator"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]
